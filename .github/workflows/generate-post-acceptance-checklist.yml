# .github/workflows/test-review-checklist.yml

name: 'Generate Post-Acceptance Checklist'

# This workflow will be triggered when a comment is created on a pull request or issue.
on:
  issue_comment:
    types: [created]

# We need permissions to update issue comments.
permissions:
  issues: write

jobs:
  add-post-acceptance-checklist:
    # This job will only run if the comment body contains the '/generate-review-checklist' command.
    if: startsWith(github.event.comment.body, '/generate-post-acceptance-checklist') && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Add Post-acceptance Checklist
        uses: actions/github-script@v9
        with:
          script: |
            // This script uses the GitHub REST API to update the comment.
            // The `github.rest.issues.updateComment` method takes the
            // owner, repo, comment_id, and the new body as arguments.

            // Define the new checklist in GitHub-flavored Markdown.
            const reviewChecklist = `
            # Post acceptance checklist

            For the FIT coordinator

            - [ ] Fork the source code repository to the \`nmfs-ost\` organization if it is not already hosted within the NOAA-NMFS GitHub Enterprise (check this off as not applicable if it is already hosted there or source code is not available).
            - [ ] Add to FIT test site and have author verify it looks as expected ([instructions for coordinator](https://github.com/nmfs-ost/fit_web_templating))
            - [ ] If R package, add to the [FIT R universe](https://noaa-fisheries-integrated-toolbox.r-universe.dev/builds) ([specification file](https://github.com/noaa-fisheries-integrated-toolbox/noaa-fisheries-integrated-toolbox.r-universe.dev/blob/main/packages.json))
            - [ ] Add to FIT production site


            `;

            // Call the GitHub API to update the comment with the new checklist.
            try {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                body: reviewChecklist,
              });
              console.log('Successfully updated comment with review checklist.');
            } catch (error) {
              console.error('Failed to update comment:', error);
            }
