# .github/workflows/test-review-checklist.yml

name: 'Generate Reviewer instructions'

# This workflow will be triggered when a comment is created on a pull request or issue.
on:
  issue_comment:
    types: [created]

# We need permissions to update issue comments.
permissions:
  issues: write

jobs:
  add-reviewer-instructions:
    # This job will only run if the comment body contains the '/generate-review-checklist' command.
    if: startsWith(github.event.comment.body, '/generate-reviewer-instructions') && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Add Reviewer instructions
        uses: actions/github-script@v9
        with:
          script: |
            // This script uses the GitHub REST API to update the comment.
            // The `github.rest.issues.updateComment` method takes the
            // owner, repo, comment_id, and the new body as arguments.

            
            // Extract and define the users github name
            //const githubName = context.event.comment.body.match(/\@\S*$/);
            const body = context.payload.comment.body || '';

            // Try to find the first Github username mention in the comment like "@username"
            // This captures common usernames containing letters, numbers and hyphens.
            // If you want to be more permissive, adjust the regex accordingly.
            const mentionMatch = body.match(/@([A-Za-z0-9-]+)/);
            const mention = mentionMatch ? `@${mentionMatch[1]}` : '';

            // If a mention was found, greet that user; otherwise provide instructions on how to include a message.
            // Define the new checklist in GitHub-flavored Markdown.
            const reviewChecklist = mention? `${mention}, thank you for volunteering to review this submission to the Fisheries Integrated Toolbox. This is a checklist-based review.

            Aim to finish within four weeks of assignment; this is a target, not a hard deadline. Discuss blockers or extensions in this issue.

            1. Generate your review checklist by commenting on this issue using the command \`/generate-reviewer-checklist\`
            2. Check off items on the checklist as you verify that they are complete.
            3. Keep review findings and questions in this submission issue. If detailed implementation work needs a source-repository issue, link it here so this remains the review record.
            4. Please feel free to ask the developer any questions, as this is an open review process.

            See the [reviewer guide](https://github.com/nmfs-ost/FIT-test-quality-checks/blob/main/reviewer-guide.md) for test definitions, safe testing guidance, and optional review aids.

            `:
            'Please provide the GitHub username of the reviewer after the command, e.g., \`/generate-reviewer-instructions @github-name\`.';

            const finalReviewChecklist = reviewChecklist;

            // Call the GitHub API to update the comment with the new checklist.
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: finalReviewChecklist,
              });
              console.log('Successfully updated comment with review checklist.');
            } catch (error) {
              console.error('Failed to update comment:', error);
            }
