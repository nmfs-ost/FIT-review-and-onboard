# .github/workflows/test-review-checklist.yml

name: 'Generate Reviewer Checklist'

# This workflow will be triggered when a comment is created on a pull request or issue.
on:
  issue_comment:
    types: [created]

# We need permissions to update issue comments.
permissions:
  issues: write

jobs:
  add-reviewer-checklist:
    # This job will only run if the comment body contains the '/generate-review-checklist' command.
    if: startsWith(github.event.comment.body, '/generate-reviewer-checklist') && contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Add Review Checklist
        uses: actions/github-script@v9
        with:
          script: |
            // This script uses the GitHub REST API to update the comment.
            // The `github.rest.issues.updateComment` method takes the
            // owner, repo, comment_id, and the new body as arguments.

            // Define the new checklist in GitHub-flavored Markdown.
            const reviewChecklist = `
            # Checklist for reviewers

            Thanks for reviewing this tool\! Please use the information submitted by the tool authors to complete the checklist.

            Aim to complete the review within four weeks of assignment, discussing extensions on this issue.
            If you have any questions, you can ask the tool author directly on this thread by using the \`@\` in front of their github username in a comment.

            Check off all items that are complete.
            ## Reviewer Basics

            - [ ] Reviewer has no known [Conflicts of Interest](https://github.com/nmfs-ost/FIT-test-quality-checks/blob/main/reviewer-guide.md#reviewer-conflict-of-interest). If the reviewer has a potential conflict of interest, it should be brought up with the FIT coordinator.
            
            ## Mandatory items

            ### Installation and example verification

            - [ ] Installation instructions are provided that the reviewer can run. Reviewer, please attempt installation and only check this off if install is verified. If this is a web app or other software type that does not require installation, check this off.
            - [ ] A getting started example (e.g., R vignette) is provided that the reviewer can run. Reviewer, attempt to run this example and only check this off if verified to run.

            ### Tests

            - [ ] The author's testing narrative provides reproducible steps and expected results; the reviewer has followed the steps and compared the results.
            - [ ] Integration tests demonstrate that components work together, and an end-to-end example demonstrates a complete workflow with expected results (manual or automated).
            - [ ] Author-provided language-specific check results have been reviewed for the submitted version, including explanations of warnings or failures (e.g., R CMD check for R packages; build and test output for Python; or a justified alternative).
            - [ ] [Code coverage](https://www.atlassian.com/continuous-delivery/software-testing/code-coverage) is acceptable (\>40% line coverage).
            - [ ] Sample data provided to validate functionality.

            ### Sound practices (not mandatory)

            - [ ] A unit testing framework (e.g., testthat, googletest, unittest) is used that allows running tests with a single command.
            - [ ] Regression tests check that changes do not reintroduce bugs or unexpectedly change established results.
            - [ ] Correctness tests compare results with known answers, analytical solutions, or independent reference implementations.
            - [ ] An example demonstrating advanced features or functions is included.
            - [ ] Web-hosted documentation is available (e.g., pkgdown site, doxygen site).
            - [ ] [Code coverage](https://www.atlassian.com/continuous-delivery/software-testing/code-coverage) is excellent (\>70% line coverage).
            - [ ] Tests set up on a continuous integration service to run automatically on code changes or on a schedule (e.g., on GitHub Actions, Travis, Jenkins).


            `;

            // Call the GitHub API to update the comment with the new checklist.
            try {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                body: reviewChecklist,
              });
              console.log('Successfully updated comment with review checklist.');
            } catch (error) {
              console.error('Failed to update comment:', error);
            }
