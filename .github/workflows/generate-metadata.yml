name: 'Generate and Validate Metadata with Copilot'

on:
#  issue_comment:
#    types: [created]
#  schedule:
#    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fit-metadata
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'Review Request') &&
       contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
       github.event.comment.body == '/generate-metadata')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install -r requirements-metadata.txt
      - name: Dispatch AI generation or validate linked PRs against the schema
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_METADATA_TOKEN: ${{ secrets.COPILOT_METADATA_TOKEN }}
        run: python -B scripts/metadata_workflow.py